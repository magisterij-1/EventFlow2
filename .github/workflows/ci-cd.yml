name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: backend
            coverage-path: backend/lcov.info
          - package: frontend
            coverage-path: frontend/coverage/
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: npm ci

      - name: Run tests with coverage
        working-directory: ${{ matrix.package }}
        run: npm run test:coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: eventflow-${{ matrix.package }}-coverage
          path: ${{ matrix.coverage-path }}
          if-no-files-found: error

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: /api
          VITE_KEYCLOAK_URL: ${{ vars.PRODUCTION_KEYCLOAK_URL }}
        run: npm run build

      - name: Prepare backend package
        working-directory: backend
        run: |
          mkdir -p "$RUNNER_TEMP/eventflow-backend/database"
          cp dist/server.js package.json package-lock.json "$RUNNER_TEMP/eventflow-backend/"
          cp database/schema.sql "$RUNNER_TEMP/eventflow-backend/database/"

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: eventflow-frontend
          path: frontend/dist/
          if-no-files-found: error

      - name: Upload backend artifact
        uses: actions/upload-artifact@v7
        with:
          name: eventflow-backend
          path: ${{ runner.temp }}/eventflow-backend/
          if-no-files-found: error

      - name: Package production image from build outputs
        shell: bash
        run: |
          context="$RUNNER_TEMP/eventflow-image-context"
          mkdir -p "$context" "$RUNNER_TEMP/eventflow-production-image"
          cp -a "$RUNNER_TEMP/eventflow-backend" "$context/backend"
          cp -a frontend/dist "$context/frontend"
          cp deploy/initialize-database.cjs "$context/"
          image="eventflow-production:$GITHUB_SHA"
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --file deploy/Dockerfile --tag "$image" "$context"
          bash deploy/smoke-image.sh "$image"
          docker save "$image" | gzip -1 > "$RUNNER_TEMP/eventflow-production-image/image.tar.gz"

      - name: Upload production image
        uses: actions/upload-artifact@v7
        with:
          name: eventflow-production-image
          path: ${{ runner.temp }}/eventflow-production-image/image.tar.gz
          if-no-files-found: error
          compression-level: 0

  deploy:
    needs: [lint, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.render.outputs.url }}
    concurrency:
      group: eventflow-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: eventflow-production-image
          path: ${{ runner.temp }}/eventflow-production-image/

      - name: Deploy prebuilt image to Render
        id: render
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KEYCLOAK_BACKEND_CLIENT_SECRET: ${{ secrets.KEYCLOAK_BACKEND_CLIENT_SECRET }}
          PRODUCTION_KEYCLOAK_URL: ${{ vars.PRODUCTION_KEYCLOAK_URL }}
          RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
          RENDER_REGISTRY_CREDENTIAL_ID: ${{ vars.RENDER_REGISTRY_CREDENTIAL_ID }}
          RENDER_SERVICE_NAME: ${{ vars.RENDER_SERVICE_NAME }}
          RENDER_REGION: ${{ vars.RENDER_REGION }}
          RENDER_PLAN: ${{ vars.RENDER_PLAN }}
        run: |
          node deploy/render-production.mjs --check-config
          docker load --input "$RUNNER_TEMP/eventflow-production-image/image.tar.gz"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
          docker tag "eventflow-production:$GITHUB_SHA" "$image"
          docker push "$image"
          export RENDER_IMAGE="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")"
          node deploy/render-production.mjs
